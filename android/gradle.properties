org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Workarounds for Kotlin/Gradle incremental cache issues when project and pub cache are on different drives
# Disables Kotlin incremental compilation which can fail when file paths have different roots
kotlin.incremental=false
# Disable Kotlin daemon to reduce file-lock / cache closing issues during Gradle build
kotlin.daemon.enabled=false
